name: Daily Static GTFS Sync & Deploy

on:
  schedule:
    # Runs every day at 19:00 UTC (which corresponds exactly to 03:00 AM GMT+8 Malaysia Time)
    - cron: '0 19 * * *'
  push:
    branches:
      - main
      - dev # Trigger runs on dev pushes to execute verification tests
  workflow_dispatch: # Allows you to click a button in GitHub to force a sync manually

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm' # Automatically caches node_modules dependencies between pipeline runs

      - name: Install Project Workspace (Deterministic)
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Run Workspace Quality Linting Controls
        run: npm run lint

      - name: Run Unit Test Suites
        run: npm run test:unit

      - name: Execute Automated Static Ingestion Script
        run: bash .devcontainer/setup.sh

      - name: Setup Hugo Compiler
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.161.1'
          extended: true # Essential if you use Sass/SCSS features down the road
      
      - name: Compile Hugo Assets Manually
        run: hugo --minify
        env:
          CF_PAGES_BRANCH: ${{ github.ref_name }}

      # --- PIPELINE INTEGRATION: VERIFICATION LAYER ---
      - name: Execute Headless Cypress End-to-End Suite
        uses: cypress-io/github-action@v6
        with:
          install: false
          # Starts your local wrangler dev/pages server in the background
          start: npm run start
          # Wait explicitly for the consolidated Hugo tracker root page to return a clean 200 OK
          wait-on: 'http://localhost:8788'
          wait-on-timeout: 120
          # Tells the action to execute your project-validated bin binary directly
          command: npx cypress run

      - name: Archive Cypress Failure Screen Captures
        uses: actions/upload-artifact@v4
        if: failure() # Captures viewport snapshots only if a test fails
        with:
          name: cypress-error-snapshots
          path: cypress/screenshots
          retention-days: 7

      - name: Deploy to Cloudflare Pages
        # Only allows the deployment block to execute if the build is on the main branch
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name="kchbasmy-tracker" --branch="${{ github.ref_name }}"
          packageManager: npm
